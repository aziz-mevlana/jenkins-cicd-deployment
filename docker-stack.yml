version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: django_db
      POSTGRES_USER: django_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    networks:
      - django-overlay
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  web:
    image: azizmevlana/complex-multistage-app:latest
    environment:
      - DJANGO_SETTINGS_MODULE=django_project.settings
    secrets:
      - django_secret_key_v2
      - db_password
    networks:
      - django-overlay
    volumes:
      - static_volume:/app/staticfiles
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    networks:
      - django-overlay
    depends_on:
      - web
    configs:
      - source: nginx_config_v2
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - static_volume:/app/staticfiles:ro
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

networks:
  django-overlay:
    external: true

volumes:
  static_volume:
  pgdata:

secrets:
  db_password:
    external: true
  django_secret_key_v2:
    external: true

configs:
  nginx_config_v2:
    file: ./nginx.conf